name: Build release images

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image.name }} / ${{ matrix.platform.arch }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: scraper
            repository: docker.io/gosom/google-maps-scraper
            dockerfile: Dockerfile
          - name: saas
            repository: ghcr.io/gosom/google-maps-scraper-saas
            dockerfile: Dockerfile.saas
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: matrix.image.name == 'scraper'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        if: matrix.image.name == 'saas'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image.repository }}
          tags: type=raw,value=${{ inputs.release_tag }}
      - name: Build and push by digest
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Smoke-test the image
        env:
          KIND: ${{ matrix.image.name }}
          REPOSITORY: ${{ matrix.image.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          bash .github/scripts/smoke-release-image.sh "$KIND" "$REPOSITORY@$DIGEST" "$ARCH"
          echo "$DIGEST" > "$RUNNER_TEMP/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/${{ matrix.platform.arch }}
          if-no-files-found: error
          overwrite: true
