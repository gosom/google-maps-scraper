name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  tag:
    needs: build
    uses: ./.github/workflows/tag-images.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      latest: ${{ !github.event.release.prerelease }}
    secrets: inherit
