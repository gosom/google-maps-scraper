name: Tag verified release images

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      latest:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  tag:
    name: Tag ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: scraper
            repository: docker.io/gosom/google-maps-scraper
          - name: saas
            repository: ghcr.io/gosom/google-maps-scraper-saas
    steps:
      - uses: docker/login-action@v3
        if: matrix.image.name == 'scraper'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        if: matrix.image.name == 'saas'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image.name }}-*
          path: digests
          merge-multiple: true
      - name: Assemble and tag the verified platforms
        env:
          REPOSITORY: ${{ matrix.image.repository }}
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags=(--tag "$REPOSITORY:$TAG")
          if [[ "$LATEST" == true ]]; then
            tags+=(--tag "$REPOSITORY:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$REPOSITORY@$(cat digests/amd64)" "$REPOSITORY@$(cat digests/arm64)"
