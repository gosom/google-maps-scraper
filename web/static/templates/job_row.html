<tr>
    <td>
        <div><strong>{{.Name}}</strong> <span class="chip chip-{{.Data.CollectorName}}" title="Which collector runs this job">{{.Data.CollectorName}}</span></div>
        <div class="faint">{{len .Data.Keywords}} search{{if ne (len .Data.Keywords) 1}}es{{end}}{{if .Data.Email}} · emails{{end}}</div>
    </td>
    <td class="nowrap muted">{{.Date.Format "Jan 2, 15:04"}} UTC</td>
    <td><span class="badge badge-{{.Status}}">{{.Status}}</span></td>
    <td class="num"><strong>0</strong></td>
    <td class="nowrap">
        <button hx-delete="/delete?id={{.ID}}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Delete this job? Its leads stay in the lead list."
                class="btn btn-sm btn-danger">Delete</button>
    </td>
</tr>
