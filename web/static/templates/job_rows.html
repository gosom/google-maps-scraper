<tbody id="job-tbody" hx-get="/jobs?page={{.CurrentPage}}" hx-trigger="every 10s" hx-swap="outerHTML">
{{range .Jobs}}
<tr>
    <td>{{.ID}}</td>
    <td>{{.Name}}</td>
    <td>{{.Date}}</td>
    <td>
        <span class="status-indicator status-{{.Status}}">{{.Status}}</span>
    </td>
    <td>
        {{ if eq .Status "ok" }}
            <button type="button" class="button view-button"
                    hx-get="/view?id={{.ID}}"
                    hx-target="#map-modal-container"
                    hx-swap="innerHTML">View</button>
            <a href="/download?id={{.ID}}" download class="button download-button">Download</a>
        {{ end }}
        <button hx-delete="/delete?id={{.ID}}" 
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this job?"
                class="delete-button">Delete</button>
    </td>
</tr>
{{end}}
{{if eq (len .Jobs) 0}}
<tr>
    <td colspan="5" style="text-align: center; padding: 1rem;">0 results</td>
</tr>
{{end}}
</tbody>

<div id="pagination-container" hx-swap-oob="true">
    {{if .HasPages}}
    <div class="pagination" style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 1rem;">
        {{if .HasPrev}}
        <button class="button" hx-get="/jobs?page={{.PrevPage}}" hx-target="#job-tbody" hx-swap="outerHTML">Previous</button>
        {{else}}
        <button class="button" disabled style="opacity: 0.5; cursor: not-allowed;">Previous</button>
        {{end}}
        <span class="page-info">Page {{.CurrentPage}} of {{.TotalPages}}</span>
        {{if .HasNext}}
        <button class="button" hx-get="/jobs?page={{.NextPage}}" hx-target="#job-tbody" hx-swap="outerHTML">Next</button>
        {{else}}
        <button class="button" disabled style="opacity: 0.5; cursor: not-allowed;">Next</button>
        {{end}}
    </div>
    {{else}}
    <div style="display: none;"></div>
    {{end}}
</div>
