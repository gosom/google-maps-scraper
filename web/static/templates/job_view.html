<div id="map-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="map-modal-title" onclick="if(event.target===this)closeJobMap()">
    <div class="bg-white w-[90vw] max-w-6xl h-[85vh] rounded-lg flex flex-col overflow-hidden">
        <div class="flex items-center justify-between p-4 border-b">
            <h2 id="map-modal-title" class="text-lg font-semibold">Places</h2>
            <button type="button" aria-label="Close" onclick="closeJobMap()" class="rounded-sm opacity-70 hover:opacity-100 transition-opacity">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="flex flex-1 min-h-0">
            <div id="job-map" class="flex-[3] h-full"></div>
            <div id="job-places-list" class="flex-1 min-w-[240px] max-w-[360px] overflow-y-auto border-l p-2 space-y-1"></div>
        </div>
    </div>
    <script>
    (function () {
        var places = {{ . }};

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str == null ? '' : str;
            return div.innerHTML;
        }

        function createMap() {
            if (window.__jobMap) {
                window.__jobMap.remove();
            }

            var map = L.map('job-map');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            window.__jobMap = map;
            return map;
        }

        function placePopup(place) {
            var parts = ['<strong>' + escapeHtml(place.title) + '</strong>'];
            if (place.address) {
                parts.push(escapeHtml(place.address));
            }
            if (place.link && /^https?:\/\//i.test(place.link)) {
                parts.push('<a href="' + encodeURI(place.link) + '" target="_blank" rel="noopener noreferrer">View on Google Maps</a>');
            }
            return parts.join('<br>');
        }

        function placeListItem(place, onSelect) {
            var item = document.createElement('div');
            item.className = 'p-3 rounded-md border hover:bg-gray-50 cursor-pointer transition-colors';
            item.innerHTML = '<div class="font-medium text-sm">' + escapeHtml(place.title) + '</div>' +
                (place.address ? '<div class="text-xs text-gray-500 mt-1">' + escapeHtml(place.address) + '</div>' : '') +
                (place.review_rating ? '<div class="text-xs text-amber-600 mt-1">★ ' + escapeHtml(String(place.review_rating)) + '</div>' : '');
            item.addEventListener('click', onSelect);
            return item;
        }

        function renderPlaces(map, listEl) {
            var bounds = [];

            places.forEach(function (place) {
                var latlng = [place.latitude, place.longitude];
                bounds.push(latlng);

                L.marker(latlng).bindPopup(placePopup(place)).addTo(map);
                listEl.appendChild(placeListItem(place, function () {
                    map.setView(latlng, 16);
                }));
            });

            map.fitBounds(bounds, { padding: [30, 30] });
            setTimeout(function () { map.invalidateSize(); }, 0);
        }

        function showEmptyState(map, listEl) {
            listEl.innerHTML = '<p class="p-4 text-gray-500">No places with coordinates were found for this job.</p>';
            map.setView([0, 0], 2);
        }

        function initJobMap() {
            var listEl = document.getElementById('job-places-list');
            var map = createMap();

            listEl.innerHTML = '';

            if (places.length === 0) {
                showEmptyState(map, listEl);
                return;
            }

            renderPlaces(map, listEl);
        }

        window.closeJobMap = function () {
            if (window.__jobMap) {
                window.__jobMap.remove();
                window.__jobMap = null;
            }

            var container = document.getElementById('map-modal-container');
            if (container) {
                container.innerHTML = '';
            }
        };

        initJobMap();
    })();
    </script>
</div>
