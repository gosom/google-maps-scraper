openapi: 3.0.3
info:
  title: Google Maps Scraper API
  version: 1.0.0
  description: API for managing job google maps scraping tasks

paths:
  /api/v1/jobs:
    post:
      summary: Create a new job scraping task
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST "http://localhost:8080/api/v1/jobs" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Coffee shops Ilion",
                "keywords": ["coffee in ilion"],
                "lang": "el",
                "zoom": 15,
                "depth": 1,
                "max_time": 3600
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiScrapeRequest'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiScrapeResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    get:
      summary: Get all jobs
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/jobs/{id}:
    get:
      summary: Get a specific job
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs/6f0c1af8-3c4e-4742-84bb-590938ae8930"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      summary: Delete a specific job
      x-code-samples:
        - lang: curl
          source: |
            curl -X DELETE "http://localhost:8080/api/v1/jobs/455a6a00-cefb-4a9d-9e7d-791f01873700"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job deleted successfully
        '422':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/jobs/{id}/download:
    get:
      summary: Download job results as CSV
      x-code-samples:
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs/18eafda3-53a9-4970-ac96-8f8dfc7011c3/download" --output results.csv
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
        '422':
          description: Invalid ID
        '500':
          description: Internal server error

  /api/v1/runs:
    get:
      summary: The run ledger's per-search rows for one or more jobs
      description: >
        One row per search a job ran, for both collectors. v2 rows carry each search's own timing;
        v1 rows are read from the job's CSV and carry the job's timing (job_level true).
      parameters:
        - name: job
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        '200':
          description: The rows
        '422':
          description: No job given

  /api/v1/verify/smoke:
    get:
      summary: Each collector's latest smoke check
      responses:
        '200':
          description: The latest smoke check of v1 and of v2, keyed by collector

  /api/v1/verify/compare/{id}:
    get:
      summary: A comparison of v1 and v2, with each arm's numbers and the verdict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The comparison report
        '404':
          description: No such comparison

components:
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    ApiScrapeRequest:
      type: object
      properties:
        name:
          type: string
        keywords:
          type: array
          items:
            type: string
        lang:
          type: string
        zoom:
          type: integer
        lat:
          type: string
        lon:
          type: string
        fast_mode:
          type: boolean
        radius:
          type: integer
        depth:
          type: integer
        email:
          type: boolean
        max_time:
          type: integer
        proxies:
          type: array
          items:
            type: string
        collector:
          type: string
          enum: [v1, v2]
          description: >
            Which collector runs the job. v1 (the default) is the browser collector. v2 reads
            Google's results without a browser and visits each website one at a time, a fixed gap
            apart, with a fixed time limit per search.
        steady:
          $ref: '#/components/schemas/SteadySpec'

    ApiScrapeResponse:
      type: object
      properties:
        id:
          type: string

    Job:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, working, ok, partial, failed]
          description: partial is a job that ran out of its time before every search was done; what it found is kept.
        data:
          $ref: '#/components/schemas/JobData'

    JobData:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
        lang:
          type: string
        zoom:
          type: integer
        lat:
          type: string
        lon:
          type: string
        fast_mode:
          type: boolean
        radius:
          type: integer
        depth:
          type: integer
        email:
          type: boolean
        max_time:
          type: integer
        proxies:
          type: array
          items:
            type: string
        collector:
          type: string
          enum: [v1, v2]
          description: >
            Which collector runs the job. v1 (the default) is the browser collector. v2 reads
            Google's results without a browser and visits each website one at a time, a fixed gap
            apart, with a fixed time limit per search.
        steady:
          $ref: '#/components/schemas/SteadySpec'
        tag:
          type: string
          description: Set by the Verify page on its jobs ("smoke" or "cmp:<comparison id>").

    SteadySpec:
      type: object
      description: Collector v2's settings. Every field is optional; the defaults are shown.
      properties:
        pages:
          type: integer
          description: Pages of 20 places read per search (1 to 6).
          default: 1
        delay_ms:
          type: integer
          description: Gap between two websites, two results pages and two searches.
          default: 1000
        contact_pages:
          type: integer
          description: Contact or about pages read per website after its front page (0 to 4).
          default: 0
        no_redirects:
          type: boolean
          description: Treat a website that redirects as unreadable instead of following it.
          default: false
        site_timeout_sec:
          type: integer
          default: 10
        query_budget_sec:
          type: integer
          description: Most time one search may take, websites included (30 to 480).
          default: 240
        retries:
          type: integer
          description: More tries of a refused Google request, each on the next proxy (0 to 3).
          default: 1

